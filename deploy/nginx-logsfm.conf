# LogsFM — Nginx
# Certbot guardó el cert en: /etc/letsencrypt/live/admin.logsfm.com/

upstream logsfm_app {
    server 127.0.0.1:3020;
    keepalive 64;
}

# ── Panel Admin ──────────────────────────────────────────────
server {
    listen 80;
    server_name admin.logsfm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.logsfm.com;

    ssl_certificate     /etc/letsencrypt/live/admin.logsfm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.logsfm.com/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://logsfm_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── API pública ──────────────────────────────────────────────
server {
    listen 80;
    server_name api.logsfm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.logsfm.com;

    ssl_certificate     /etc/letsencrypt/live/admin.logsfm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.logsfm.com/privkey.pem;

    add_header Access-Control-Allow-Origin "https://logsfm.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        proxy_pass http://logsfm_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Stream Icecast ───────────────────────────────────────────
server {
    listen 80;
    server_name stream.logsfm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stream.logsfm.com;

    ssl_certificate     /etc/letsencrypt/live/admin.logsfm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.logsfm.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
}
